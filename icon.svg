<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
>

    <defs>

        <linearGradient
            id="fondo"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >

            <stop
                offset="0%"
                stop-color="#1fc775"
            />

            <stop
                offset="100%"
                stop-color="#067249"
            />

        </linearGradient>

    </defs>


    <rect
        width="512"
        height="512"
        rx="120"
        fill="url(#fondo)"
    />


    <circle
        cx="256"
        cy="205"
        r="112"
        fill="#ffffff"
        opacity="0.14"
    />


    <text
        x="256"
        y="270"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="190"
        font-weight="900"
        fill="#ffffff"
    >
        5
    </text>


    <text
        x="256"
        y="376"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="56"
        font-weight="900"
        letter-spacing="5"
        fill="#ffffff"
    >
        PAUSA
    </text>


    <circle
        cx="402"
        cy="102"
        r="21"
        fill="#ffffff"
        opacity="0.90"
    />

</svg>